[project]
name = "aerotrack"
version = "0.1.0"
description = "Real-time vehicle and pedestrian detection + tracking on drone video, under embedded latency constraints."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.4,<8.5",
    "torch>=2.4",
    "torchvision>=0.19",
    "onnx>=1.17",
    "onnxslim>=0.1.50",
    "onnxruntime>=1.20",
    "pycocotools>=2.0.8",
    "wandb>=0.19",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "trackeval",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
# TensorRT engines (week 8): Linux + NVIDIA only, never on the Mac. CUDA 12 build, to match
# the cu126 torch; Ultralytics builds the engine from our ONNX export through its Python API.
# The `tensorrt-cu12` metapackage is an sdist only; its two wheel dependencies are taken
# directly (the bindings provide the `tensorrt` module).
trt = [
    "tensorrt-cu12-libs>=10.9,<11; sys_platform == 'linux'",
    "tensorrt-cu12-bindings>=10.9,<11; sys_platform == 'linux'",
]

[project.scripts]
aerotrack = "aerotrack.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerotrack"]

[tool.uv]
# The lockfile is resolved for exactly the two platforms we run on. Jetson (aarch64,
# JetPack) ships its own torch wheels and is handled separately at deployment time.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
# TrackEval is not published on PyPI; pin the upstream commit for reproducibility.
trackeval = { git = "https://github.com/JonathonLuiten/TrackEval" }
# Linux: CUDA 12.6 builds. PyPI's default Linux wheels target CUDA 13, which needs an
# NVIDIA driver >= 580 that many rented GPUs do not have yet; cu126 runs on drivers >= 525.
# macOS keeps the PyPI wheels (MPS).
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
# TensorRT: PyPI only carries stub sdists that download the real wheels from NVIDIA's index
# at build time (and fail to build on macOS while locking); take the wheels from there.
tensorrt-cu12-libs = { index = "nvidia" }
tensorrt-cu12-bindings = { index = "nvidia" }
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access (model weights, datasets); skipped unless --run-network",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Markdown table headers are kept on one line so they stay readable in the source.
"src/aerotrack/eval/report.py" = ["E501"]
