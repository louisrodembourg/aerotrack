# Week 5: tiled inference (SAHI-style slicing, inference.Detector) on YOLO26n trained at
# 640. A 2x2 grid plus the whole frame shows each object at about twice its 640 scale,
# like a 1280 input, so the plain 1280 model is the comparison: same pixels on the
# object, one pass instead of five. Re-timed in one session; test-dev, 10 classes.
name: w5-sahi
seed: 0
device: auto
dataset:
  gt: visdrone_det/gt/test-dev.json
  class_map: visdrone
  limit: null
models:
  - {run: visdrone-yolo26n-640, imgsz: 640}
  - {run: visdrone-yolo26n-640, name: visdrone-yolo26n-640-tiled, imgsz: 640, tiles: [2, 2]}
  - {run: visdrone-yolo26n-p2-640, name: visdrone-yolo26n-p2-640-tiled, imgsz: 640, tiles: [2, 2]}
  - {run: visdrone-yolo26n-1280, imgsz: 1280}
detection:
  imgsz: 640
  conf: 0.001
  iou: 0.7
  max_det: 500
  tile_overlap: 0.2
  tile_full: true
  merge_ios: 0.5
latency:
  enabled: true
  backends: [torch, onnxruntime]
  conf: 0.25
  n_images: 50
  warmup: 20
  iters: 200
