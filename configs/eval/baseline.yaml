# Zero-shot COCO detectors on VisDrone-DET val, no fine-tuning, inference only.
# Only VisDrone classes with an unambiguous COCO counterpart are scored
# (class map `visdrone_to_coco`, excluded classes listed in configs/data/class_maps.yaml).
name: baseline
seed: 0
device: auto
dataset:
  gt: visdrone_det/gt/val.json
  class_map: visdrone_to_coco
  limit: null            # all 548 val images
models:
  - {weights: yolo26n.pt}
  - {weights: yolo26s.pt}
  - {weights: yolo11n.pt}
  - {weights: yolo11s.pt}
detection:
  imgsz: 640
  conf: 0.001            # accuracy is measured over the full PR curve
  iou: 0.7               # NMS IoU (ignored by end-to-end YOLO26 heads)
  max_det: 500           # VisDrone protocol evaluates up to 500 detections per image
latency:
  enabled: true
  backends: [torch, onnxruntime]   # torch on the resolved device, onnxruntime on CPU
  conf: 0.25             # deployment threshold: NMS cost depends on surviving candidates
  n_images: 50
  warmup: 20
  iters: 200
