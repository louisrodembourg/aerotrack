# Week 3 reference detectors: YOLO26n and YOLO26s fine-tuned at 640 on VisDrone-DET
# (configs/train/visdrone_yolo26{n,s}_640.yaml), scored on test-dev, the split no choice
# ever looks at. Accuracy on the 10 VisDrone classes + latency on this machine.
name: w3-reference
seed: 0
device: auto
dataset:
  gt: visdrone_det/gt/test-dev.json
  class_map: visdrone
  limit: null
models:
  - {run: visdrone-yolo26n-640}
  - {run: visdrone-yolo26s-640}
detection:
  imgsz: 640
  conf: 0.001
  iou: 0.7
  max_det: 500
latency:
  enabled: true
  backends: [torch, onnxruntime]
  conf: 0.25
  n_images: 50
  warmup: 20
  iters: 200
