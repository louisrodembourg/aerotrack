# Week 11: robustness of the reference detectors to synthetic degradations of the frame
# (aerotrack.eval.degrade): motion blur, sensor noise, JPEG compression, low light, three
# levels each, on VisDrone-DET test-dev. Every model sees the same degraded frames.
# Accuracy only: runs on the Mac (`make w11-degrade-eval`).
name: w11-degradations
seed: 0
device: auto
dataset:
  gt: visdrone_det/gt/test-dev.json
  class_map: visdrone
  limit: null
models:
  - {run: visdrone-yolo26n-640, imgsz: 640, name: n640}
  - {run: visdrone-yolo26n-1280, imgsz: 1280, name: n1280}
detection:
  imgsz: 640
  conf: 0.001
  iou: 0.7
  max_det: 500
  half: false
degradations:
  - {kind: motion_blur, levels: [5, 11, 21]}   # px
  - {kind: noise, levels: [5, 15, 30]}         # std, 0-255 scale
  - {kind: jpeg, levels: [50, 20, 10]}         # quality
  - {kind: low_light, levels: [0.5, 0.25, 0.1]}  # exposure gain
latency:
  enabled: false
