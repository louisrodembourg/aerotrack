# Week 4: what the P2 (stride-4) head buys YOLO26n, and what it costs, at 640 and 960.
# Plain and P2 models are re-timed in the same session so their latencies compare;
# test-dev, 10 VisDrone classes. The P2 960 run is the continuation of the run
# interrupted at the Kaggle deadline (DECISIONS.md).
name: w4-p2
seed: 0
device: auto
dataset:
  gt: visdrone_det/gt/test-dev.json
  class_map: visdrone
  limit: null
models:
  - {run: visdrone-yolo26n-640, imgsz: 640}
  - {run: visdrone-yolo26n-p2-640, imgsz: 640}
  - {run: visdrone-yolo26n-960, imgsz: 960}
  - {run: visdrone-yolo26n-p2-960, imgsz: 960}
detection:
  imgsz: 640
  conf: 0.001
  iou: 0.7
  max_det: 500
latency:
  enabled: true
  backends: [torch, onnxruntime]
  conf: 0.25
  n_images: 50
  warmup: 20
  iters: 200
