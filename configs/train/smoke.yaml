# Local end-to-end check of the training chain (data -> masked loader -> train -> tracked
# run -> evaluation) on ~100 images. Not a result: it exists to fail fast on the Mac
# before paying for a GPU, and to measure this machine's training throughput.
name: smoke
seed: 0
device: auto
model: yolo26n.pt
data:
  dataset: visdrone_det
  train_limit: 100
  val_limit: 100
train:
  epochs: 3
  imgsz: 640
  batch: 8
  workers: 2
  deterministic: true
  plots: false
evaluate:
  class_map: visdrone
  split: val
  limit: 100
  imgsz: 640
  conf: 0.001
  iou: 0.7
  max_det: 500
