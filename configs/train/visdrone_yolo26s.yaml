# First real fine-tuning run (weeks 3-4), meant for a CUDA box:
#   scripts/remote_train.sh configs/train/visdrone_yolo26s.yaml
name: visdrone-yolo26s-640
seed: 0
device: auto
model: yolo26s.pt
data:
  dataset: visdrone_det
train:
  epochs: 100
  imgsz: 640
  batch: 16
  workers: 8
  deterministic: true
  cos_lr: true
  close_mosaic: 10
evaluate:
  class_map: visdrone
  split: val
  limit: null
  imgsz: 640
  conf: 0.001
  iou: 0.7
  max_det: 500
