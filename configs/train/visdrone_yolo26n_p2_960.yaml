# Week 4 P2 head: YOLO26n with a stride-4 detection level for small objects, at 960;
# otherwise identical to visdrone_yolo26n_960.yaml
name: visdrone-yolo26n-p2-960
seed: 0
device: auto
model: yolo26n-p2.yaml
pretrained: yolo26n.pt     # backbone + matching neck tensors; the P2 branch starts random
data:
  dataset: visdrone_det
train:
  epochs: 100
  imgsz: 960
  batch: 8              # P2 maps are 4x the P3 ones: half the 960 batch to fit a T4;
                         # nominal batch stays 64 (nbs): gradients accumulate over 64/batch
  workers: 2             # 2 jobs share a Kaggle session's vCPUs; see logs/utilisation.csv
  deterministic: true
  cos_lr: true
  close_mosaic: 10
evaluate:
  # Monitoring only: best.pt is selected on val, so val numbers are optimistic. Reported
  # results come from `aerotrack evaluate` on test-dev (DECISIONS.md).
  class_map: visdrone
  split: val
  limit: null
  imgsz: 960
  conf: 0.001
  iou: 0.7
  max_det: 500
