# Week 3 reference fine-tuning, YOLO26s at 640 on the full VisDrone-DET train split.
# Meant for a CUDA box; on Kaggle, the n and s references share one session (one per T4):
#   uv run aerotrack kaggle push configs/train/visdrone_yolo26n_640.yaml \
#       configs/train/visdrone_yolo26s_640.yaml --slug aerotrack-w3-ref
# Same hyper-parameters as the n reference: n vs s differ by architecture only.
name: visdrone-yolo26s-640
seed: 0
device: auto
model: yolo26s.pt
data:
  dataset: visdrone_det
train:
  epochs: 100
  imgsz: 640
  batch: 16
  workers: 2             # 2 jobs share a Kaggle session's vCPUs; see logs/utilisation.csv
  deterministic: true
  cos_lr: true
  close_mosaic: 10
evaluate:
  # Monitoring only: best.pt is selected on val, so val numbers are optimistic. Reported
  # results come from `aerotrack evaluate` on test-dev (DECISIONS.md).
  class_map: visdrone
  split: val
  limit: null
  imgsz: 640
  conf: 0.001
  iou: 0.7
  max_det: 500
